<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>상담 관리 — 예당고 진로 도우미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/assets/app.css?v=10" />
<style>
  .adm-top { background: var(--pine); color: #fff; }
  .adm-top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .adm-top b { font-size: 17px; }
  .adm-top .sp { margin-left: auto; display: flex; gap: 8px; }
  .adm-top .btn-ghost { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .login { max-width: 400px; margin: 80px auto; }
  .tabs { display: flex; gap: 6px; margin: 28px 0 18px; }
  .tabs button { border: 1.5px solid var(--line); background: var(--white); border-radius: 999px; padding: 8px 18px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 24px; color: var(--pine); }
  .stat span { font-size: 13px; color: var(--muted); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
  .filters .f { min-width: 150px; }
  .day-head { font-weight: 800; color: var(--pine); margin: 24px 0 8px; font-size: 16px; }
  .bk { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: start; }
  .bk.cancelled { opacity: .55; }
  .bk .tm { font-weight: 800; font-size: 18px; color: var(--pine); }
  .bk .tm small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .bk h4 { margin: 0 0 4px; font-size: 16.5px; }
  .bk .meta { font-size: 14px; color: var(--muted); }
  .bk .msg { font-size: 14px; margin-top: 6px; background: var(--paper); border-radius: 8px; padding: 8px 10px; }
  .bk .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 140px; }
  .bk select, .bk textarea { width: 100%; border: 1.5px solid var(--line-2); border-radius: 8px; padding: 7px 8px; font-size: 14px; background: #fff; }
  .bk textarea { min-height: 54px; margin-top: 8px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tags span { font-size: 12.5px; background: var(--tea-2); color: var(--pine); border-radius: 999px; padding: 2px 9px; font-weight: 600; }
  .sched-day { display: grid; grid-template-columns: 140px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sched-day .d { font-weight: 700; }
  .sched-day .sl { display: flex; gap: 6px; flex-wrap: wrap; }
  .sl button { border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 13.5px; font-weight: 700; }
  .sl button.taken { background: var(--tea-2); border-color: var(--tea); color: var(--pine); cursor: default; }
  .sl button.blocked { background: #FBE7E6; border-color: #E9B9B5; color: var(--danger); text-decoration: line-through; }
  .sched-day.off .d { color: #AEB8B0; }
  @media (max-width: 760px) { .bk { grid-template-columns: 1fr; } .sched-day { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="adm-top"><div class="wrap"><b>상담 관리</b><span style="color:#B8CFC0;font-size:14px">예당고 진로 도우미</span><div class="sp" id="topActs"></div></div></header>
<main class="wrap" id="app"></main>
<script src="/assets/admin.js?v=10"></script>
</body>
</html>
